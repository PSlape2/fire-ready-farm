<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildfire Hazard Detector — Live Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
      gap: 12px;
    }

    /* Title — left */
    #topbar h1 { font-size: 1rem; font-weight: 600; letter-spacing: .03em; flex: 1; }
    #topbar h1 span { color: #f78166; }

    /* ── FFWI Badge — inline center ── */
    #ffwi-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 5px 14px;
      min-width: 160px;
      justify-content: center;
    }
    #ffwi-score { font-size: 1.4rem; font-weight: 700; }
    #ffwi-label { font-size: 0.62rem; color: #8b949e; text-transform: uppercase; letter-spacing: .08em; }
    #risk-level {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
    }
    .risk-Low      { background:#1a4731; color:#56d364; }
    .risk-Moderate { background:#3d2e00; color:#e3b341; }
    .risk-High     { background:#3d1300; color:#f78166; }
    .risk-Extreme  { background:#2d1040; color:#d2a8ff; }

    /* ── Right side controls ── */
    #controls-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: flex-end;
    }

    /* Status dot */
    #status-wrap { display:flex; align-items:center; gap:6px; font-size:.78rem; color:#8b949e; }
    #status-dot {
      width:9px; height:9px; border-radius:50%; flex-shrink:0;
      background:#238636; box-shadow:0 0 6px #238636;
    }
    #status-dot.scanning { background:#f78166; box-shadow:0 0 6px #f78166; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* Stop button */
    #stop-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      background: #2d1300;
      color: #f78166;
      border: 1px solid #f78166;
      transition: opacity .15s;
    }
    #stop-btn:hover { opacity: .8; }

    /* Interval controls */
    #interval-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 10px;
    }
    #interval-wrap .interval-label {
      font-size: .65rem;
      color: #8b949e;
    }
    #interval-wrap .interval-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #interval-slider {
      width: 80px;
      cursor: pointer;
      accent-color: #f78166;
    }
    #interval-wrap .interval-val { font-size:.75rem; color:#e6edf3; min-width:22px; }

    /* ── Stop modal ── */
    #stop-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.78);
      align-items: center;
      justify-content: center;
    }
    #stop-modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 320px;
      width: calc(100% - 32px);
      text-align: center;
    }
    #stop-modal-card .modal-icon { font-size: 2.5rem; margin-bottom: 14px; }
    #stop-modal-card h2 { font-size: 1.1rem; font-weight: 700; color: #e6edf3; margin-bottom: 6px; }
    #stop-modal-card p  { font-size: .82rem; color: #8b949e; margin-bottom: 24px; }
    .modal-btn {
      display: block;
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      margin-bottom: 10px;
      border: none;
    }
    .modal-btn:last-child { margin-bottom: 0; }
    .modal-btn:hover { opacity: .85; }
    #modal-resume { background: #238636; color: white; }
    #modal-exit   { background: transparent; color: #8b949e; border: 1px solid #30363d !important; }

    /* ── Main area ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Video panel ── */
    #video-wrap {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video { max-width: 100%; max-height: 100%; object-fit: contain; }
    canvas { display: none; }

    #cam-overlay {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,.55);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: .72rem;
      color: #8b949e;
    }

    /* ── Right panel ── */
    #right-panel {
      width: 340px;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border-left: 1px solid #30363d;
      overflow: hidden;
    }
    #right-panel h2 {
      padding: 12px 16px;
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #8b949e;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    #hazard-list { flex: 1; overflow-y: auto; padding: 10px; }

    .hazard-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-left: 3px solid transparent;
    }
    .hazard-MUST   { border-left-color: #f78166; }
    .hazard-SHOULD { border-left-color: #e3b341; }
    .hazard-COULD  { border-left-color: #58a6ff; }
    .hazard-MAY    { border-left-color: #56d364; }

    .hazard-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .urgency-badge {
      font-size:.65rem; font-weight:700; padding:2px 7px;
      border-radius:20px; text-transform:uppercase;
    }
    .badge-MUST   { background:#3d1300; color:#f78166; }
    .badge-SHOULD { background:#3d2e00; color:#e3b341; }
    .badge-COULD  { background:#0d2c56; color:#58a6ff; }
    .badge-MAY    { background:#1a4731; color:#56d364; }

    .hazard-name   { font-size:.82rem; font-weight:600; }
    .hazard-loc    { font-size:.72rem; color:#8b949e; margin-bottom:4px; }
    .hazard-action { font-size:.75rem; color:#c9d1d9; line-height:1.4; }
    .no-hazards    { text-align:center; color:#8b949e; font-size:.82rem; padding:40px 20px; }

    /* ── Weather strip ── */
    #weather-strip {
      display: flex;
      justify-content: space-around;
      padding: 10px 14px;
      background: #0d1117;
      border-top: 1px solid #30363d;
      font-size: .78rem;
      color: #8b949e;
      flex-shrink: 0;
    }
    #weather-strip span b { color:#e6edf3; }

    /* ── Raw JSON drawer ── */
    #json-drawer {
      background: #0d1117;
      border-top: 1px solid #30363d;
      max-height: 150px;
      overflow-y: auto;
      padding: 8px 12px;
      font-size: .68rem;
      font-family: monospace;
      color: #8b949e;
      flex-shrink: 0;
    }
    #json-drawer summary { cursor:pointer; color:#58a6ff; margin-bottom:4px; }

    /* ── Error toast ── */
    #error-toast {
      display:none;
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      background:#3d1300; border:1px solid #f78166; color:#f78166;
      padding:10px 20px; border-radius:8px; font-size:.82rem; z-index:999;
    }
  </style>
</head>
<body>

<!-- Stop modal -->
<div id="stop-modal">
  <div id="stop-modal-card">
    <div class="modal-icon">⏸</div>
    <h2>Scanning Paused</h2>
    <p>What would you like to do?</p>
    <button class="modal-btn" id="modal-resume">▶ Resume Scanning</button>
    <button class="modal-btn" id="modal-exit">✕ Exit</button>
  </div>
</div>

<!-- Top bar -->
<div id="topbar">
  <!-- Left: title -->
  <h1>🔥 Wildfire <span>Hazard Detector</span></h1>

  <!-- Center: FFWI badge -->
  <div id="ffwi-badge">
    <div>
      <div id="ffwi-label">FFWI</div>
      <div id="ffwi-score">—</div>
    </div>
    <span id="risk-level" class="risk-Low">—</span>
  </div>

  <!-- Right: controls -->
  <div id="controls-wrap">
    <div id="status-wrap">
      <div id="status-dot"></div>
      <span id="status-text">Initializing…</span>
    </div>

    <div id="interval-wrap">
      <span class="interval-label">⚙️ Scan Interval</span>
      <div class="interval-row">
        <input type="range" id="interval-slider" min="5" max="30" value="8" step="1" />
        <span class="interval-val"><b id="interval-val">8</b>s</span>
      </div>
    </div>

    <button id="stop-btn">⏹ Stop</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <!-- Camera -->
  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="cam-overlay">GPS: 32.8801, -117.2340 (UCSD)</div>
  </div>

  <!-- Right panel -->
  <div id="right-panel">
    <h2>Detected Hazards</h2>
    <div id="hazard-list">
      <div class="no-hazards">Camera feed starting…</div>
    </div>
    <div id="weather-strip">
      <span>🌡 <b id="w-temp">—</b>°F</span>
      <span>💧 <b id="w-hum">—</b>%</span>
      <span>💨 <b id="w-wind">—</b> mph</span>
      <span>📍 Score: <b id="w-score">—</b>/5</span>
    </div>
    <details id="json-drawer">
      <summary>Raw JSON response</summary>
      <pre id="json-out">—</pre>
    </details>
  </div>
</div>

<div id="error-toast"></div>

<script>
  const API_BASE   = 'http://localhost:8000';
  const GPS        = { lat: 32.8801, lon: -117.2340 };

  const video      = document.getElementById('video');
  const canvas     = document.getElementById('canvas');
  const ctx        = canvas.getContext('2d');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const slider     = document.getElementById('interval-slider');
  const intervalEl = document.getElementById('interval-val');
  const stopBtn    = document.getElementById('stop-btn');
  const stopModal  = document.getElementById('stop-modal');

  /* ⚙️ SCAN INTERVAL — change default value here */
  let intervalMs = 8000;
  let scanTimer  = null;

  // ── Interval slider ──
  slider.addEventListener('input', () => {
    intervalMs = parseInt(slider.value) * 1000;
    intervalEl.textContent = slider.value;
    statusText.textContent = `Active — every ${slider.value}s`;
  });

  // ── Stop / modal controls ──
  stopBtn.addEventListener('click', () => {
    if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
    stopModal.style.display = 'flex';
  });

  document.getElementById('modal-resume').addEventListener('click', () => {
    stopModal.style.display = 'none';
    scanFrame(); // restarts the loop
  });

  document.getElementById('modal-exit').addEventListener('click', () => {
    window.location.href = '/';
  });

  // ── Camera ──
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = stream;
      return true;
    } catch (e) {
      showError('Camera access denied: ' + e.message);
      statusText.textContent = 'Camera error';
      return false;
    }
  }

  function captureFrame() {
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    ctx.drawImage(video, 0, 0);
    return canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
  }

  // ── UI update ──
  function updateWeather(w, ffwi, risk) {
    document.getElementById('w-temp').textContent  = w.temperature_f;
    document.getElementById('w-hum').textContent   = w.humidity_pct;
    document.getElementById('w-wind').textContent  = w.wind_mph;
    document.getElementById('ffwi-score').textContent = ffwi.toFixed(1);
    const riskEl = document.getElementById('risk-level');
    riskEl.textContent = risk;
    riskEl.className = 'risk-' + risk;
  }

  function updateUI(data) {
    updateWeather(data.weather, data.ffwi_score, data.risk_level);
    document.getElementById('w-score').textContent = data.overall_score;

    const list = document.getElementById('hazard-list');
    if (!data.hazards || data.hazards.length === 0) {
      list.innerHTML = '<div class="no-hazards">✅ No hazards detected in this frame.</div>';
    } else {
      list.innerHTML = data.hazards.map(h => `
        <div class="hazard-card hazard-${h.urgency}">
          <div class="hazard-header">
            <span class="urgency-badge badge-${h.urgency}">${h.urgency}</span>
            <span class="hazard-name">${h.name}</span>
          </div>
          <div class="hazard-loc">📍 ${h.location_in_image}</div>
          <div class="hazard-action">${h.action}</div>
        </div>
      `).join('');
    }
    document.getElementById('json-out').textContent = JSON.stringify(data, null, 2);
  }

  function showError(msg) {
    const toast = document.getElementById('error-toast');
    toast.textContent = '⚠ ' + msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  // ── Weather fetch (independent — shows data even if vision fails) ──
  async function fetchWeather() {
    try {
      const resp = await fetch(`${API_BASE}/weather?lat=${GPS.lat}&lon=${GPS.lon}`);
      if (!resp.ok) return;
      const w = await resp.json();
      updateWeather(w, w.ffwi_score, w.risk_level);
    } catch (_) {}
  }

  // ── Scan loop — uses setTimeout so interval is dynamically adjustable ──
  async function scanFrame() {
    statusDot.classList.add('scanning');
    statusText.textContent = 'Analyzing…';

    await fetchWeather(); // always show weather even if vision fails below

    try {
      const b64  = captureFrame();
      const resp = await fetch(`${API_BASE}/analyze`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_base64: b64, lat: GPS.lat, lon: GPS.lon }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      updateUI(data);
      fetch(`${API_BASE}/report/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ analysis: data }),
      }).catch(() => {});
    } catch (e) {
      showError('Analysis failed: ' + e.message);
    } finally {
      statusDot.classList.remove('scanning');
      statusText.textContent = `Active — every ${slider.value}s`;
      scanTimer = setTimeout(scanFrame, intervalMs);
    }
  }

  // ── Boot ──
  (async () => {
    const ok = await startCamera();
    if (ok) {
      video.addEventListener('loadeddata', () => {
        statusText.textContent = `Active — every ${slider.value}s`;
        scanFrame();
      }, { once: true });
    }
  })();
</script>
</body>
</html>
